# pre-commit hook configuration
# Docs: https://pre-commit.com/
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually on all files:
#   pre-commit run --all-files
#
# This config covers both TypeScript (workspace) and Python (packages/, flightctl/, tools/,
# deliverables/ — repo-wide as of code-hygiene-modularity T-2.1; previously scoped to
# deliverables/ only, so ~98% of tracked Python files were never linted locally).

repos:

  # ── Secret scanning ─────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        args: ["--config", ".gitleaks.toml", "--no-banner"]

  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "^deliverables/.*\\.md$"   # markdown uses trailing spaces for line breaks
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]                  # allows custom YAML tags (e.g. !!str)
      - id: check-json
        exclude: "tsconfig.*\\.json$"       # tsconfig uses comments (not strict JSON)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # ── TypeScript / Node.js ────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: ts-typecheck
        name: TypeScript type check
        language: system
        entry: pnpm -r run typecheck
        pass_filenames: false
        files: "\\.tsx?$"
        types: [file]

      - id: eslint
        name: ESLint
        language: system
        entry: pnpm -r run lint
        pass_filenames: false
        files: "\\.tsx?$"
        types: [file]

  # ── Instruction files ───────────────────────────────────────────────────────
  # Deliberately the only governance checker here; the other six (bind_guard,
  # literal_guard, check_tool_pins, check_task_sync, validate_workforce,
  # validate_skills) run from `make -f tools/Makefile checkers`,
  # scripts/validate-pre-pr.sh, and the CI `governance` job. This one is also in
  # all three of those — the local copy exists because these files are loaded as
  # trusted system context, so catching a dead path or a misspelled `paths:` key at
  # edit time is worth the ~100ms. It is stdlib-only and `files:`-scoped, so it runs
  # only when an instruction file is staged. Like every pre-commit hook it is
  # bypassable with --no-verify; CI is the copy that is not.
  - repo: local
    hooks:
      - id: validate-agents-docs
        name: instruction-file lint (AGENTS.md, .claude/rules)
        language: system
        entry: python tools/validate_agents_docs.py
        pass_filenames: false
        files: "(^|/)AGENTS\\.md$|^\\.claude/rules/.*\\.md$"

  # ── Python (repo-wide) ──────────────────────────────────────────────────────
  # Revs below must match the ruff/mypy pins in both packages' pyproject [dev] extras —
  # tools/check_tool_pins.py fails CI on a mismatch (code-hygiene-modularity T-2.10).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        name: ruff (Python linter)
        args: ["--fix"]
        files: "\\.(py)$"
        exclude: "^archive/"
      - id: ruff-format
        name: ruff-format (Python formatter)
        files: "\\.(py)$"
        exclude: "^archive/"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: mypy (Python type check)
        files: "\\.(py)$"
        exclude: "^archive/"
        additional_dependencies:
          - pytest>=8
          - aiohttp>=3.14.3
          - types-PyYAML
          # Without pydantic/structlog the hook sees import-not-found cascades ("cannot
          # subclass BaseModel (has type Any)") that CI, with real deps installed, never
          # reports — the two environments must reach the same verdict.
          - pydantic>=2
          - structlog
