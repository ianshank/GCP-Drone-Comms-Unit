# Keeps the exact tool pins (ruff/mypy in the package [dev] extras, SHA-pinned workflow
# actions, the gitleaks rev) from rotting: pins without update automation are staleness
# by design. tools/check_tool_pins.py fails CI if a pyproject pin, the pre-commit rev, or
# the CI gitleaks version diverge.
#
# The pnpm workspace is intentionally absent: its `ts` CI job landed (P0-4 of
# docs/CODE_QUALITY_TECH_DEBT_PLAN.md), but the workspace still carries Replit-era
# packages that T-2.3b archives; enable an `npm` entry once that archive lands so
# dependabot is not bumping packages scheduled for deletion.
version: 2

# ruff and mypy are pinned in THREE files that must agree (both packages' pyproject
# [dev] extras + the .pre-commit-config.yaml mirror revs). A per-ecosystem bump moves
# one file, so every such PR was red by design (PRs #67/#68/#71/#72/#50/#51). This
# group makes the three move in one PR. Dependabot names pre-commit hooks by their full
# repository URL, so the pre-commit patterns are URLs, not hook ids.
multi-ecosystem-groups:
  python-tooling:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Both entries use `patterns: ["*"]` deliberately: an update entry that joins a
  # multi-ecosystem group updates ONLY the dependencies matching its patterns, so a narrow
  # pattern list would silently stop every other pip and pre-commit update (the first
  # version of this file listed ruff/mypy only; a review caught it). The price is one
  # weekly PR carrying every Python-side bump — pyproject ranges, the CI lock in
  # /requirements (plan P1-6), and every pre-commit rev — instead of one PR per
  # dependency. A gitleaks bump in that PR is red until the CI GITLEAKS_VERSION/SHA256
  # pair is hand-bumped to match; that is the signal check_tool_pins.py exists to give.
  - package-ecosystem: pre-commit
    directory: /
    multi-ecosystem-group: python-tooling
    patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /packages/meshsa
      - /packages/jetson_yolo_gcs
      - /requirements
    multi-ecosystem-group: python-tooling
    patterns: ["*"]
