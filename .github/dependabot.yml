# Keeps the exact tool pins (ruff/mypy in the package [dev] extras, SHA-pinned workflow
# actions) from rotting: pins without update automation are staleness by design.
# tools/check_tool_pins.py fails CI if a pyproject pin and the pre-commit rev diverge,
# so a dependabot bump of one surfaces the required bump of the other.
# The pnpm workspace is intentionally absent until its CI job lands (T-2.3b).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Required, not optional: check_tool_pins.py fails CI when a pyproject ruff/mypy pin
  # and the matching pre-commit rev disagree. Without this ecosystem dependabot could
  # only ever move one side, so every ruff/mypy bump PR would land red and need a hand
  # edit. With both enabled the two PRs are each red alone and green once merged as a
  # pair — that is the intended signal.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /packages/meshsa
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /packages/jetson_yolo_gcs
    schedule:
      interval: weekly
