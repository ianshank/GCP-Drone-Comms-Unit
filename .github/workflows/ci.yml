name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Rapid pushes to a PR branch supersede each other; cancel the stale run. Pushes to main
# are never cancelled — every landed commit keeps a complete CI verdict (bisect integrity).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    # Budget note: the meshsa suite itself runs in ~17s (measured 2026-08-14); the
    # timeout is dominated by pip install. If this limit is ever approached, the suite
    # has regressed — investigate before raising it.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # -c: every transitive version comes from the committed lock
          # (requirements/ci-constraints.txt, plan P1-6), so an upstream release cannot
          # turn this job red on its own; dependabot proposes the lock's bumps as PRs.
          pip install -e "packages/meshsa[dev,inference]" -c requirements/ci-constraints.txt
          # tools/claude_hooks (governance.py) depends on pyyaml, not a meshsa dependency.
          # Pinned: this job's verdict must not drift with an upstream release.
          pip install pyyaml==6.0.3 types-PyYAML==6.0.12.20260724

      - name: Lint
        run: ruff check packages/meshsa flightctl tools deliverables --exclude archive

      - name: Format check
        run: ruff format --check packages/meshsa flightctl tools deliverables --exclude archive

      - name: Type check
        working-directory: packages/meshsa
        run: mypy src
      - name: Type check flightctl + tools
        # A single invocation across packages/ + flightctl/ + tools/ + deliverables/ is not
        # possible: pytest's flat (no-__init__.py) test-collection convention means every
        # package's tests/ and conftest.py collide under one bare module name if mixed into one
        # mypy pass (see CHANGELOG "The repo-wide mypy step had never completed a real run").
        # flightctl/ + tools/ form one coherent namespace and check together; deliverables/ and
        # each src-layout package check separately below/above.
        run: mypy flightctl/ tools/ --exclude archive
      - name: Type check deliverables
        run: mypy deliverables/ --exclude archive

      - name: Test
        working-directory: packages/meshsa
        # -m "not slow": the 5,000-cycle link-loss fuzz is the nightly workflow's job
        # (docs/specs/m2-soak-fuzz.md §7); a 250-cycle smoke slice of the same fuzz body
        # stays in this gate. Coverage measured identical (99.31%) with and without the
        # slow test. Hypothesis runs the derandomized "ci" profile (tests/conftest.py).
        run: pytest -m "not slow" --cov-report=xml

      - name: Coverage summary
        # always(): the gate lives in addopts (--cov-fail-under=97), so the step that
        # publishes the number would otherwise be skipped in exactly the run where the
        # number is the failure.
        if: always()
        working-directory: packages/meshsa
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, sys, xml.etree.ElementTree as ET
          p = pathlib.Path("coverage.xml")
          if not p.is_file():
              print("**meshsa coverage**: coverage.xml not produced (pytest failed before "
                    "writing it, or --cov-report=xml was dropped)")
              sys.exit(0)
          r = ET.parse(p).getroot()
          print(f"**meshsa coverage**: {float(r.get('line-rate'))*100:.2f}% lines, "
                f"{float(r.get('branch-rate'))*100:.2f}% branches (gate: 97%)")
          EOF

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-meshsa-py${{ matrix.python }}
          path: packages/meshsa/coverage.xml

      - name: Build sdist + wheel
        working-directory: packages/meshsa
        run: |
          pip install build
          python -m build

  perception:
    name: perception (py${{ matrix.python }})
    runs-on: ubuntu-latest
    # Suite runs in ~3s (measured 2026-08-14); the timeout is install-dominated.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # -c: see the meshsa job — the lock covers both packages' [dev] extras.
          pip install -e "packages/jetson_yolo_gcs[dev]" -c requirements/ci-constraints.txt

      - name: Lint
        run: ruff check packages/jetson_yolo_gcs

      - name: Format check
        run: ruff format --check packages/jetson_yolo_gcs

      - name: Type check
        working-directory: packages/jetson_yolo_gcs
        run: mypy src

      - name: Test
        working-directory: packages/jetson_yolo_gcs
        run: pytest --cov-report=xml

      - name: Coverage summary
        # always(): see the meshsa job — the gate is in addopts, so without this the
        # number is missing from the summary precisely when it caused the failure.
        if: always()
        working-directory: packages/jetson_yolo_gcs
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, sys, xml.etree.ElementTree as ET
          p = pathlib.Path("coverage.xml")
          if not p.is_file():
              print("**jetson_yolo_gcs coverage**: coverage.xml not produced (pytest failed "
                    "before writing it, or --cov-report=xml was dropped)")
              sys.exit(0)
          r = ET.parse(p).getroot()
          print(f"**jetson_yolo_gcs coverage**: {float(r.get('line-rate'))*100:.2f}% lines, "
                f"{float(r.get('branch-rate'))*100:.2f}% branches (gate: 96%)")
          EOF

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-jetson-py${{ matrix.python }}
          path: packages/jetson_yolo_gcs/coverage.xml

      - name: Build sdist + wheel
        working-directory: packages/jetson_yolo_gcs
        run: |
          pip install build
          python -m build

  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Pinned: this job executes the scope-freeze/bind-guard tooling, whose Pydantic
          # models are extra="forbid" — its verdict must not drift with an upstream release.
          pip install pydantic==2.13.4 pyyaml==6.0.3 pytest==9.1.1 pytest-cov==7.1.0

      - name: Governance hook tests (coverage floor 90)
        # The tools tree was measured report-only from 2026-08 to 2026-10 and held at
        # 95-96% the whole time, so the floor is now gated at 90 (P0-5 of
        # docs/CODE_QUALITY_TECH_DEBT_PLAN.md). The remaining gap is scope_freeze.py,
        # which is subprocess-tested and reads ~28%; the floor rises to 95 once it gains
        # in-process tests. --cov-fail-under sits on the pytest command, not in a config
        # file, because tools/ has no pyproject of its own.
        #
        # `shell: bash` is load-bearing, not cosmetic: the default runner shell is
        # `bash -e` WITHOUT pipefail, so `pytest | tee` would exit with tee's status and
        # a fully failing suite would report this job green.
        shell: bash
        run: |
          python -m pytest tools/claude_hooks/tests tools/tests -q \
            --cov=tools --cov-report=term --cov-fail-under=90 | tee /tmp/tools-cov.txt
          if ! grep -E '^TOTAL' /tmp/tools-cov.txt \
            | awk '{print "**tools/claude_hooks coverage (gate: 90%)**: " $NF}' \
            >> "$GITHUB_STEP_SUMMARY"; then
            echo "::warning title=Coverage summary missing::no TOTAL line in the pytest --cov output"
          fi

      - name: Bind guard
        run: python tools/claude_hooks/bind_guard.py

      - name: Literal guard
        run: python tools/claude_hooks/literal_guard.py

      - name: Workforce roster lint
        run: python tools/validate_workforce.py

      - name: Skills playbook lint
        run: python tools/validate_skills.py

      - name: Instruction-file lint
        run: python tools/validate_agents_docs.py

      - name: Tool-pin sync
        run: python tools/check_tool_pins.py

      - name: Dead-code scan (vulture, advisory)
        # Advisory by design (plan P1-2): vulture's candidates are claims to verify, not
        # findings — registry-decorated factories, pydantic validators and Protocol
        # methods all read as unused at lower confidence. At 80 the only hit on the
        # baseline was a pypubsub callback parameter, now in tools/vulture_whitelist.py.
        # Each candidate becomes a run annotation; the step never fails the job. No pipe,
        # so this step does not depend on pipefail.
        run: |
          pip install vulture==2.16
          vulture packages/meshsa/src packages/jetson_yolo_gcs/src \
            flightctl/run_gateway.py flightctl/run_commander.py flightctl/sim tools \
            --exclude 'tools/claude_hooks/tests,tools/tests' --min-confidence 80 \
            > /tmp/vulture.txt || true
          while IFS= read -r line; do
            echo "::warning title=vulture (advisory, plan P1-2)::${line}"
          done < /tmp/vulture.txt
          echo "**vulture (advisory, confidence >= 80)**: $(wc -l < /tmp/vulture.txt) candidate(s)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Pragma reasons (advisory)
        # Convention (plan P1-4): every `# pragma: no cover` carries a reason after ` - `
        # so a grep can audit the exclusions by kind. Bare pragmas are warnings, not
        # failures; the count lands in the step summary next to the coverage numbers.
        run: |
          grep -rnE '# pragma: no cover\s*$' packages/meshsa/src packages/jetson_yolo_gcs/src \
            flightctl tools --include='*.py' > /tmp/bare-pragmas.txt || true
          while IFS= read -r line; do
            echo "::warning title=bare pragma (advisory, plan P1-4)::${line}"
          done < /tmp/bare-pragmas.txt
          total=$(grep -rE '# pragma: no cover' packages/meshsa/src packages/jetson_yolo_gcs/src \
            flightctl tools --include='*.py' | wc -l)
          echo "**pragma: no cover**: ${total} total, $(wc -l < /tmp/bare-pragmas.txt) without a reason" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Secret scan (gitleaks)
        # Pre-commit runs gitleaks locally but is bypassable (--no-verify); this is the
        # non-bypassable copy. Version matches the pre-commit rev; the checksum pins the
        # exact artifact.
        env:
          # Must equal the gitleaks rev in .pre-commit-config.yaml (tools/check_tool_pins.py
          # fails the governance job when they disagree). The checksum is for the linux_x64
          # release tarball of exactly this version; verify it by hand on every bump.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --config .gitleaks.toml --source . --no-banner --redact

  ts:
    name: ts
    runs-on: ubuntu-latest
    # The TypeScript workspace had a full local gate (scripts/validate-pre-pr.sh steps
    # 1-4: typecheck, ESLint, vitest, api-server build) and no CI job at all until P0-4
    # of docs/CODE_QUALITY_TECH_DEBT_PLAN.md. Measured 2026-10-27: install ~7s from a warm
    # store, the four gates well under a minute; the timeout is install-dominated.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        # No `version:` input on purpose: the action reads `packageManager` (version +
        # integrity hash, written by `corepack use`) from the root package.json, so CI and
        # a contributor's shell resolve the same pnpm (pnpm itself enforces that field
        # locally). The Dockerfile still runs `corepack prepare pnpm@latest`; P3-4 aligns it.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build composite libs
        # lib/api-zod and lib/db are TS composite projects (emitDeclarationOnly) whose
        # gitignored dist/ .d.ts output must exist before dependents resolve their
        # `references` — the AGENTS.md "build the libs before type-checking" trap.
        run: pnpm --filter './lib/*' run build

      - name: Type check
        run: pnpm -r run typecheck

      - name: Lint
        # Only api-server declares a `lint` script; mockup-sandbox is Replit-era and is
        # archived by T-2.3b rather than linted.
        run: pnpm -r run lint

      - name: Test
        run: pnpm -r run test

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

  shell:
    name: shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install shellcheck
        # Installed explicitly rather than trusting the runner image to keep shipping it.
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: Syntax check (bash -n)
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x --severity=warning
