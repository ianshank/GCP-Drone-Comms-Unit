name: nightly

# Scheduled deeper run. Precisely: the meshsa suite on py3.12 with fuller extras + the
# @slow fuzz + randomized Hypothesis + mypy against real optional-dependency types.
#   * Fuller extras ([dev,meshtastic,health,mavlink,msp,fpv,camera,llm]) un-skip the
#     tests PR CI's [dev,inference] install skips (test_fpv_convert.py's pyarrow trio,
#     test_node.py's pubsub test) and catch optional-dependency typing drift.
#   * Runs the full suite (slow included) under the same --cov-fail-under=97 gate, so
#     the gate is also enforced on the path that includes the 5,000-cycle link-loss
#     fuzz (per-PR CI runs -m "not slow" plus a 250-cycle smoke slice — see
#     docs/specs/m2-soak-fuzz.md §7).
#   * HYPOTHESIS_PROFILE=nightly explores fresh randomized inputs; print_blob is on, so
#     a failure log carries a paste-able @reproduce_failure decorator that outlives this
#     ephemeral runner.
# This is NOT a superset of PR CI: no py3.10/3.11, no jetson_yolo_gcs suite, no
# lint/format/governance/shell/build jobs.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the on-failure step files/updates a tracking issue

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (full extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/meshsa[dev,meshtastic,health,mavlink,msp,fpv,camera,llm]"

      - name: Type check with optional deps present
        working-directory: packages/meshsa
        run: mypy src

      - name: Full suite + slow soak tests
        working-directory: packages/meshsa
        env:
          HYPOTHESIS_PROFILE: nightly
        run: pytest

      - name: Surface failure as an issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Emit the triage pointer before touching the API: if gh is unavailable or
          # unauthorized, the operator still gets the run URL from the log.
          echo "::notice title=Nightly soak/fuzz failed::${run_url}"
          body=$(printf '%s\n' \
            "Nightly soak/fuzz run failed: ${run_url}" \
            "Hypothesis ran the randomized 'nightly' profile with print_blob on — for a" \
            "property-test failure the job log contains a @reproduce_failure decorator." \
            "Triage owner: repo maintainer (see CONTRIBUTING.md flaky-test policy).")
          # `first(.[].number) // empty` yields an EMPTY string when nothing matches.
          # `.[0].number` yields the literal string "null", which passes `[ -n ]` and
          # sends `gh issue comment null` — so the very first failure (the case with no
          # open issue yet) would never file one.
          if ! num=$(gh issue list --state open --search "in:title nightly soak/fuzz failure" \
              --json number --jq 'first(.[].number) // empty'); then
            echo "::warning title=Issue filing skipped::gh issue list failed (auth/rate limit?); failure is at ${run_url}"
            exit 0
          fi
          if [ -n "${num}" ]; then
            gh issue comment "${num}" --body "${body}" \
              || echo "::warning title=Issue filing skipped::gh issue comment on #${num} failed"
          else
            gh issue create --title "nightly soak/fuzz failure" --body "${body}" \
              || echo "::warning title=Issue filing skipped::gh issue create failed"
          fi
